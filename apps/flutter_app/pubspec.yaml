name: lts_pricing
description: "LTS Pricing — Phần Mềm Báo Giá & Tính Giá Thành Bao Bì (Flutter Android client)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # JS engine (QuickJS) để chạy bundle engine.bundle.js
  flutter_js: ^0.8.1

  # State management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.2

  # REST client cho backend service-lts (auth JWT)
  http: ^1.2.0

  # Chọn ảnh đại diện / chữ ký từ gallery + camera
  image_picker: ^1.1.2

  # i18n / format số tiếng Việt
  intl: ^0.20.2

  # PDF export cho LSX
  pdf: ^3.11.1
  printing: ^5.13.0

  # File / path
  path_provider: ^2.1.4

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/engine.bundle.js
    - assets/data/constants.json
    - assets/data/materials.json
    - assets/data/profitTable.json
    - assets/data/history.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 300
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800

